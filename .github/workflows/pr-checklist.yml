name: Pull request checklist

# Every pull request says how it was tested (CONTRIBUTING.md, "Pull requests"):
# the template's "Tests" and "How I tested it" sections must have something in
# them besides the template's own comments. Reads the description only; no code
# from the pull request runs here.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read

jobs:
  description:
    runs-on: ubuntu-latest
    steps:
      - name: Tests and how it was tested are filled in
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          python3 - <<'EOF'
          import os, re, sys
          body = re.sub(r"<!--.*?-->", "", os.environ.get("BODY") or "", flags=re.S)
          sections = {m.group(1).strip().lower(): m.group(2).strip()
                      for m in re.finditer(r"^##\s+(.+?)\s*$\n(.*?)(?=^##\s|\Z)", body, re.S | re.M)}
          missing = [name for name in ("Tests", "How I tested it") if not sections.get(name.lower())]
          for name in missing:
              print(f"::error::The \"{name}\" section of the description is empty. "
                    "Say which tests you ran or added, and how you tried the change (with screenshots "
                    "if a screen changed). See CONTRIBUTING.md, Pull requests.")
          if missing:
              sys.exit(1)
          if "## how i tested it" in body.lower() and not re.search(r"!\[|<img|\.(png|jpe?g|gif|mp4|mov)\b", body, re.I):
              print("::warning::No screenshot or photo in the description. If the change shows on a "
                    "screen, add before and after shots (firmware/tools/board.py shot out.png).")
          print("The description says what was tested and how.")
          EOF
